version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: main
    schedule:
      interval: "yearly"
    open-pull-requests-limit: 10
    assignees:
      - "jonasscholl"
    ignore:
      # TypeScript 7 is the Go-native compiler and no longer ships the JS Compiler API
      # that @n8n/node-cli's build/lint tooling relies on. Revisit when node-cli supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 requires a newer @n8n/node-cli peer than we currently pin.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "yearly"
    open-pull-requests-limit: 5
    assignees:
      - "jonasscholl"
    groups:
      github-actions:
        patterns:
          - "*"
